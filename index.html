<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>Wplace 官方模板转png转换器</title>
    <style>
        :root { --bg: #f8fafc; --card: #ffffff; --primary: #3b82f6; --primary-hover: #2563eb; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); margin: 0; padding: 20px; color: #1e293b; }
        .grid { display: grid; grid-template-columns: 420px 1fr; gap: 20px; max-width: 1500px; margin: 0 auto; }
        .card { background: var(--card); border-radius: 12px; padding: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        .form-group { margin-bottom: 12px; }
        label { display: block; font-size: 11px; font-weight: 700; color: #64748b; text-transform: uppercase; margin-bottom: 4px; }
        input[type="text"], input[type="number"], select { width: 100%; padding: 8px 10px; border: 1px solid #cbd5e1; border-radius: 6px; box-sizing: border-box; font-size: 13px; }
        
        .box-panel { background: #f1f5f9; padding: 10px; border-radius: 8px; margin-bottom: 8px; }
        .coord-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
        .dimension-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .info-text { font-size: 11px; color: #64748b; margin-bottom: 6px; }

        .file-drop { border: 2px dashed #cbd5e1; border-radius: 10px; padding: 20px; text-align: center; cursor: pointer; background: #f1f5f9; transition: all 0.2s; }
        .file-drop.drag-over { border-color: var(--primary); background: #eff6ff; scale: 1.02; }

        .palette-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; max-height: 150px; overflow-y: auto; border: 1px solid #e2e8f0; padding: 6px; border-radius: 6px; background: #f8fafc; }
        .palette-item { display: flex; align-items: center; gap: 4px; font-size: 11px; cursor: pointer; }
        .color-dot { width: 12px; height: 12px; border-radius: 3px; border: 1px solid rgba(0,0,0,0.2); display: inline-block; flex-shrink: 0; }

        .btn { background: var(--primary); color: white; border: none; padding: 10px; font-weight: 600; border-radius: 8px; cursor: pointer; width: 100%; margin-top: 8px; font-size: 13px; }
        .btn:hover { background: var(--primary-hover); }
        .btn-green { background: #10b981; }
        .btn-green:hover { background: #059669; }
        
        .preview-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .preview-box { border: 1px solid #e2e8f0; border-radius: 8px; padding: 10px; text-align: center; background: #f8fafc; }
        .preview-box h4 { margin: 0 0 10px 0; font-size: 12px; color: #64748b; }
        canvas, img { max-width: 100%; height: auto; border: 1px solid #cbd5e1; border-radius: 4px; image-rendering: pixelated; 
            background-image: conic-gradient(#e2e8f0 25%, transparent 25%), conic-gradient(transparent 75%, #e2e8f0 75%), conic-gradient(#e2e8f0 25%, transparent 25%), conic-gradient(transparent 75%, #e2e8f0 75%);
            background-size: 16px 16px; background-position: 0 0, 0 8px, 8px -8px, -8px 0;
        }
    </style>
</head>
<body>

<div class="grid">
    <!-- 左侧：编辑器面板 -->
    <div class="card">
        <div class="file-drop" id="dropZone" onclick="document.getElementById('fileInput').click()">
            <strong style="color:var(--primary);">点击或拖拽 .wplace 文件到这里</strong>
            <input type="file" id="fileInput" accept=".wplace,.json" style="display:none">
        </div>

        <form id="editorForm" style="display:none;">
            <div class="form-group">
                <label>原图文件名 (Name)</label>
                <input type="text" id="propName">
            </div>

            <!-- 四坐标位置输入框 -->
            <div class="form-group">
                <label>左上角坐标位置 (Top-Left Four-Coordinates)</label>
                <div class="box-panel">
                    <div class="coord-grid">
                        <div>
                            <label>Tile X</label>
                            <input type="number" id="coordTlX" oninput="onCoordChange()">
                        </div>
                        <div>
                            <label>Tile Y</label>
                            <input type="number" id="coordTlY" oninput="onCoordChange()">
                        </div>
                        <div>
                            <label>Pixel X</label>
                            <input type="number" id="coordPxX" min="0" max="999" oninput="onCoordChange()">
                        </div>
                        <div>
                            <label>Pixel Y</label>
                            <input type="number" id="coordPxY" min="0" max="999" oninput="onCoordChange()">
                        </div>
                    </div>
                </div>
            </div>

            <!-- 目标尺寸控制 -->
            <div class="form-group">
                <label>转换尺寸调整 (Target Dimensions)</label>
                <div class="box-panel">
                    <div class="info-text">原图尺寸: <strong id="origDimText">0 x 0</strong> px</div>
                    <div class="dimension-grid">
                        <div>
                            <label>目标宽度 (px)</label>
                            <input type="number" id="targetWidth" oninput="onTargetWidthChange(this.value)">
                        </div>
                        <div>
                            <label>目标高度 (px)</label>
                            <input type="number" id="targetHeight" oninput="onTargetHeightChange(this.value)">
                        </div>
                    </div>
                    <div style="margin-top:6px; font-size:11px;">
                        <label style="display:inline-flex; align-items:center; gap:4px; font-weight:normal; text-transform:none;">
                            <input type="checkbox" id="lockAspect" checked> 锁定长宽比例 (Keep Aspect Ratio)
                        </label>
                    </div>
                </div>
            </div>

            <div class="form-group">
                <label>Color Palette (调色板范围)</label>
                <select id="propColorPaletteMode" onchange="onPaletteModeChange(this.value)">
                    <option value="all">All colors (所有颜色)</option>
                    <option value="free">Free colors (免费基础颜色)</option>
                    <option value="original">Original template colors (原模版颜色)</option>
                </select>
            </div>

            <div class="form-group">
                <label>Color Metric (色差匹配算法)</label>
                <select id="propColorMetric" onchange="renderPipeline()">
                    <option value="lab">Perceptual (CIELAB 感知模式)</option>
                    <option value="ciede2000">CIEDE2000 (高精度模式)</option>
                    <option value="compuphase">Weighted RGB (加权 RGB 模式)</option>
                </select>
            </div>

            <div class="form-group">
                <label><input type="checkbox" id="propDithering" onchange="renderPipeline()"> Dithering (开启色彩抖动)</label>
            </div>

            <div class="form-group">
                <label><input type="checkbox" id="propUseLegacyColors" onchange="renderPipeline()"> Use Legacy Colors (旧版颜色兼容)</label>
            </div>

            <div class="form-group">
                <label>Opacity (透明度: <span id="opacityVal">1</span>)</label>
                <input type="range" id="propOpacity" min="0" max="1" step="0.05" oninput="document.getElementById('opacityVal').innerText=this.value; renderPipeline();">
            </div>

            <div class="form-group">
                <label>Active Template Colors (已选颜色列表)</label>
                <div class="palette-grid" id="paletteGrid"></div>
            </div>

            <button type="button" class="btn" onclick="exportWplace()">💾 导出新的 .wplace 文件</button>
            <button type="button" class="btn btn-green" onclick="exportPNG()">🖼️ 导出转换后的 PNG 图片</button>
        </form>
    </div>

    <!-- 右侧：实时预览区 -->
    <div class="card">
        <h3 style="margin-top:0;">原图与预览图</h3>
        <div class="preview-grid">
            <div class="preview-box">
                <h4>原始图片 (Original)</h4>
                <img id="origImg" src="" alt="原图">
            </div>
            <div class="preview-box">
                <h4>官方算法转换效果 (Quantized Output)</h4>
                <canvas id="outCanvas"></canvas>
            </div>
        </div>
    </div>
</div>

// ==================== 页面控制逻辑 ====================

const dropZone = document.getElementById('dropZone');

dropZone.addEventListener('dragover', () => dropZone.classList.add('drag-over'));

dropZone.addEventListener('drop', (e) => {

document.getElementById('fileInput').addEventListener('change', (e) => {
    if (e.target.files.length) loadFile(e.target.files[0]);
});

function loadFile(file) {
    let reader = new FileReader();
    reader.onload = function(evt) {
        try {
            currentWplace = JSON.parse(evt.target.result);
            initUI();
        } catch (err) { alert("无效的 .wplace JSON 文件！"); }
    };
    reader.readAsText(file);
}

function initUI() {
    document.getElementById('propName').value = currentWplace.name || "";
    document.getElementById('propColorMetric').value = currentWplace.colorMetric || "lab";
    document.getElementById('propColorPaletteMode').value = currentWplace.colorPaletteMode || "free";
    document.getElementById('propDithering').checked = !!currentWplace.dithering;
    document.getElementById('propUseLegacyColors').checked = !!currentWplace.useLegacyColors;
    document.getElementById('propOpacity').value = currentWplace.opacity ?? 1;
    document.getElementById('opacityVal').innerText = currentWplace.opacity ?? 1;

    renderPaletteCheckboxes();

    origImgObj = document.getElementById('origImg');
    origImgObj.onload = function() {
        let origW = origImgObj.naturalWidth, origH = origImgObj.naturalHeight;
        document.getElementById('origDimText').innerText = `${origW} x ${origH}`;

        // 提取 1x 原始 ImageData
        let c = document.createElement('canvas');
        c.width = origW; c.height = origH;
        let cx = c.getContext('2d', { colorSpace: 'srgb' });
        cx.drawImage(origImgObj, 0, 0);
        origRawImageData = cx.getImageData(0, 0, origW, origH);

        let bData = currentWplace.bounds;
        if (bData) {
            // 计算四坐标 (North & West)
            let tf = latLngToTileFour(bData.north, bData.west);
            document.getElementById('coordTlX').value = tf.tlX;
            document.getElementById('coordTlY').value = tf.tlY;
            document.getElementById('coordPxX').value = tf.pxX;
            document.getElementById('coordPxY').value = tf.pxY;

            // 计算目标像素长宽
            let pSE = latLngToPixel(bData.south, bData.east);
            let calcW = Math.round(Math.abs(pSE.x - tf.x));
            let calcH = Math.round(Math.abs(pSE.y - tf.y));
            document.getElementById('targetWidth').value = calcW || origW;
            document.getElementById('targetHeight').value = calcH || origH;
        } else {
            document.getElementById('coordTlX').value = 0;
            document.getElementById('coordTlY').value = 0;
            document.getElementById('coordPxX').value = 0;
            document.getElementById('coordPxY').value = 0;
            document.getElementById('targetWidth').value = origW;
            document.getElementById('targetHeight').value = origH;
        }
        renderPipeline();
    };
    origImgObj.src = currentWplace.image.dataUrl;
    document.getElementById('editorForm').style.display = "block";
}

function onCoordChange() {
    renderPipeline();
}

function onTargetWidthChange(newW) {
    newW = parseInt(newW) || 1;
    if (document.getElementById('lockAspect').checked && origImgObj) {
        let ratio = origImgObj.naturalHeight / origImgObj.naturalWidth;
        document.getElementById('targetHeight').value = Math.round(newW * ratio);
    }
    renderPipeline();
}

function onTargetHeightChange(newH) {
    newH = parseInt(newH) || 1;
    if (document.getElementById('lockAspect').checked && origImgObj) {
        let ratio = origImgObj.naturalWidth / origImgObj.naturalHeight;
        document.getElementById('targetWidth').value = Math.round(newH * ratio);
    }
    renderPipeline();
}

function renderPaletteCheckboxes() {
    let grid = document.getElementById('paletteGrid');
    grid.innerHTML = "";
    let activeSet = new Set(currentWplace.templateColorIdxs || []);
    for (let i = 1; i < b.colors.length; i++) {
        let item = b.colors[i];
        let rgbStr = `rgb(${item.rgb.join(',')})`;
        let label = document.createElement('label');
        label.className = 'palette-item';
        label.innerHTML = `
            <input type="checkbox" value="${i}" ${activeSet.has(i) ? 'checked' : ''} onchange="renderPipeline()">
            <span class="color-dot" style="background:${rgbStr}"></span>
            <span>${i}.${item.name}</span>
        `;
        grid.appendChild(label);
    }
}

function onPaletteModeChange(mode) {
    currentWplace.colorPaletteMode = mode;
    let checkboxes = document.querySelectorAll('#paletteGrid input[type="checkbox"]');
    if (mode === 'all') checkboxes.forEach(cb => cb.checked = true);
    else if (mode === 'free') checkboxes.forEach(cb => cb.checked = parseInt(cb.value) <= 31);
    renderPipeline();
}

function renderPipeline() {
    if (!origRawImageData) return;

    let targetW = parseInt(document.getElementById('targetWidth').value) || origRawImageData.width;
    let targetH = parseInt(document.getElementById('targetHeight').value) || origRawImageData.height;

    // 1. hx 采样缩放
    let scaledImageData;
    if (targetW === origRawImageData.width && targetH === origRawImageData.height) {
        scaledImageData = new ImageData(new Uint8ClampedArray(origRawImageData.data), targetW, targetH);
    } else {
        scaledImageData = hx(origRawImageData, targetW, targetH);
    }

    // 2. iE 转换
    let allowedIdxs = Array.from(document.querySelectorAll('#paletteGrid input:checked')).map(cb => parseInt(cb.value));
    if (allowedIdxs.length === 0) allowedIdxs = [31];

    let metric = document.getElementById('propColorMetric').value;
    let dithering = document.getElementById('propDithering').checked;
    let opacity = parseFloat(document.getElementById('propOpacity').value);
    let cacheMap = new Map();

    const generator = iE(scaledImageData.data, targetW, targetH, metric, dithering, allowedIdxs, cacheMap);
    while (!generator.next().done) {}

    // 透明度调整
    if (opacity < 1) {
        let tData = scaledImageData.data;
        for (let i = 3; i < tData.length; i += 4) {
            tData[i] = Math.round(tData[i] * opacity);
        }
    }

    // 3. 绘制预览
    let outCanvas = document.getElementById('outCanvas');
    outCanvas.width = targetW; outCanvas.height = targetH;
    let outCtx = outCanvas.getContext('2d', { colorSpace: 'srgb' });
    outCtx.putImageData(scaledImageData, 0, 0);
}

// 导出文件
function exportWplace() {
    let tlX = parseInt(document.getElementById('coordTlX').value) || 0;
    let tlY = parseInt(document.getElementById('coordTlY').value) || 0;
    let pxX = parseInt(document.getElementById('coordPxX').value) || 0;
    let pxY = parseInt(document.getElementById('coordPxY').value) || 0;

    let targetW = parseInt(document.getElementById('targetWidth').value) || origRawImageData.width;
    let targetH = parseInt(document.getElementById('targetHeight').value) || origRawImageData.height;

    // 从四坐标和长宽算出最新的 bounds 经纬度
    let nw = tileFourToLatLng(tlX, tlY, pxX, pxY);
    let se = tileFourToLatLng(0, 0, nw.x + targetW, nw.y + targetH);

    currentWplace.bounds = {
        north: nw.lat,
        west: nw.lng,
        south: se.lat,
        east: se.lng
    };

    currentWplace.name = document.getElementById('propName').value;
    currentWplace.colorMetric = document.getElementById('propColorMetric').value;
    currentWplace.colorPaletteMode = document.getElementById('propColorPaletteMode').value;
    currentWplace.dithering = document.getElementById('propDithering').checked;
    currentWplace.useLegacyColors = document.getElementById('propUseLegacyColors').checked;
    currentWplace.opacity = parseFloat(document.getElementById('propOpacity').value);
    currentWplace.templateColorIdxs = Array.from(document.querySelectorAll('#paletteGrid input:checked')).map(cb => parseInt(cb.value));

    let blob = new Blob([JSON.stringify(currentWplace, null, 2)], { type: "application/json" });
    let a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = (currentWplace.name || "template").replace(/\.[^/.]+$/, "") + ".wplace";
    a.click();
}

function exportPNG() {
    let canvas = document.getElementById('outCanvas');
    let a = document.createElement('a');
    a.href = canvas.toDataURL('image/png');
    a.download = (currentWplace.name || "converted") + "_quantized.png";
    a.click();
}
</script>
